- Rete e DNS:
    - Pi-hole:
        href: https://pihole.{{HOMEPAGE_VAR_DUCKDNS}}.duckdns.org
        description: Blocco ads e DNS
        icon: pi-hole
        widget:
          type: pihole
          url: http://pihole
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"

    - Unbound:
        href: "#"
        description: DNS resolver privato
        icon: mdi-dns
        server: my-docker
        container: unbound

- VPN e dominio:
    - WireGuard:
        description: VPN WireGuard
        icon: wireguard
        server: my-docker
        container: wireguard

    - DuckDNS:
        description: IP pubblico dinamico
        icon: duckdns
        server: my-docker
        container: duckdns

    - Nginx Proxy Manager:
        href: http://{{HOMEPAGE_VAR_PI_IP}}:81
        description: Reverse proxy HTTPS
        icon: nginx-proxy-manager
        server: my-docker
        container: npm

- Monitoraggio:
    - Uptime Kuma:
        href: https://kuma.{{HOMEPAGE_VAR_DUCKDNS}}.duckdns.org
        description: Stato dei servizi
        icon: uptime-kuma
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: default

    - Netdata:
        href: https://netdata.{{HOMEPAGE_VAR_DUCKDNS}}.duckdns.org
        description: CPU, RAM, temperatura
        icon: netdata
        widget:
          type: netdata
          url: http://netdata:19999
